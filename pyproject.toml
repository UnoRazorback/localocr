[project]
name = "ocr-service"
version = "0.1.0"
description = "Local MCP server: Apple Vision OCR for scanned PDFs and images (macOS only)"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.28.1",
    "PyMuPDF==1.28.0",
    "pyobjc-core==12.2.1",
    "pyobjc-framework-Vision==12.2.1",
    "pyobjc-framework-Quartz==12.2.1",
    "pyobjc-framework-Cocoa==12.2.1",
    "pyobjc-framework-CoreML==12.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
ocr-service = "ocr_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
